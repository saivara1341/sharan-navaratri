  <!-- GitHub Pages SPA BrowserRouter Redirect Decoder -->
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))

    <div id="root"></div>
    <div id="global-error" style="position: fixed; z-index: 999999; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,0,0,0.9); color: white; padding: 20px; font-size: 18px; display: none; overflow: auto;">
      <h2>Runtime Error!</h2>
      <pre id="global-error-text"></pre>
    </div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.getElementById('global-error').style.display = 'block';
        document.getElementById('global-error-text').innerText += '\n' + message + '\n' + (error ? error.stack : '');
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('global-error').style.display = 'block';
        document.getElementById('global-error-text').innerText += '\nUnhandled Rejection: ' + event.reason;
      });
    </script>
