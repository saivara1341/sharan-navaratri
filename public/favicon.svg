<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Fiery Outer Flame Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" /> <!-- Brand primary orange -->
      <stop offset="50%" stop-color="#ef4444" /> <!-- Red flame -->
      <stop offset="100%" stop-color="#84cc16" /> <!-- Brand electric accent green -->
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Center Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for 3D Depth -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="-2" dy="-2" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" />

  <!-- Main Fiery Chakra Wheel Wrapper with Shadow -->
  <g filter="url(#shadow3d)">
    
    <!-- OUTER RING: 16 Sweeping Fiery Wings/Petals representing Dynamics -->
    <g id="outer-petals">
      <!-- We generate 16 symmetric curved petals with a clean rotational group -->
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(22.5, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(45, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(67.5, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(90, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(112.5, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(135, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(157.5, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(180, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(202.5, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(225, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(247.5, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(270, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(292.5, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(315, 256, 256)" />
      <path d="M 256,40 C 290,40 330,85 330,110 C 330,125 300,135 285,130 C 270,125 256,90 256,90 C 256,90 242,125 227,130 C 212,135 182,125 182,110 C 182,85 222,40 256,40 Z" fill="url(#fireGrad)" opacity="0.95" transform="rotate(337.5, 256, 256)" />
    </g>

    <!-- INNER RING: Clean metallic geometric Sudarshana disc -->
    <!-- Circular track ring of gold -->
    <circle cx="256" cy="256" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="16" />
    <circle cx="256" cy="256" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="4" />

    <!-- 24 Triangular razor teeth pointing outward on the outer rim of the gold ring -->
    <g id="spikes" fill="url(#goldGrad)">
      <!-- 24 iterations: 360 / 24 = 15 degrees rotational step -->
      <polygon points="256,110 251,126 261,126" />
      <polygon points="256,110 251,126 261,126" transform="rotate(15, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(30, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(45, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(60, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(75, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(90, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(105, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(120, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(135, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(150, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(165, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(180, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(195, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(210, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(225, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(240, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(255, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(270, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(285, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(300, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(315, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(330, 256, 256)" />
      <polygon points="256,110 251,126 261,126" transform="rotate(345, 256, 256)" />
    </g>

    <!-- CORE SPOKES: 8 Curved propeller-like blades radiating from center -->
    <g id="propeller-spokes" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M 256,256 C 256,210 286,180 300,160" />
      <path d="M 256,256 C 256,210 286,180 300,160" transform="rotate(45, 256, 256)" stroke-linecap="round" />
      <path d="M 256,256 C 256,210 286,180 300,160" transform="rotate(90, 256, 256)" stroke-linecap="round" />
      <path d="M 256,256 C 256,210 286,180 300,160" transform="rotate(135, 256, 256)" stroke-linecap="round" />
      <path d="M 256,256 C 256,210 286,180 300,160" transform="rotate(180, 256, 256)" stroke-linecap="round" />
      <path d="M 256,256 C 256,210 286,180 300,160" transform="rotate(225, 256, 256)" stroke-linecap="round" />
      <path d="M 256,256 C 256,210 286,180 300,160" transform="rotate(270, 256, 256)" stroke-linecap="round" />
      <path d="M 256,256 C 256,210 286,180 300,160" transform="rotate(315, 256, 256)" stroke-linecap="round" />
    </g>

    <!-- BRIGHT CENTRAL CORE -->
    <circle cx="256" cy="256" r="60" fill="url(#goldGrad)" />
    <circle cx="256" cy="256" r="50" fill="#000000" opacity="0.2" />
    <circle cx="256" cy="256" r="35" fill="url(#coreGlow)" />
    <circle cx="256" cy="256" r="10" fill="#ffffff" />
  </g>
</svg>
