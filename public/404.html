<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Siddhi Dynamics | Redirecting...</title>
    <script type="text/javascript">
        // Basic redirect for SPAs on GitHub Pages
        // This ensures that hitting a direct URL (without a hash) redirects to the root
        // so that the React App can load and handle the session.
        // Redirect to the root but PRESERVE the hash (where the auth token is)
        window.location.replace(window.location.origin + window.location.hash);
    </script>
</head>
<body>
    <div style="font-family: sans-serif; text-align: center; padding-top: 50px;">
      <h1>Siddhi Dynamics</h1>
      <p>Redirecting you back to the application...</p>
    </div>
</body>
</html>
